name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 快速冒烟：只装两个静态 peer 依赖（几秒），跑全部纯函数自检 + 假 ctx 冒烟测试
  # 用 npm ci + 提交的 lockfile 精确复现测试条件（issue #19：peer "*" + 浮动安装
  # 曾解析到 0.0.1-rc.1，"针对 0.1.5-rc.2 测试"无法复现）
  unit:
    name: unit (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Assert peer versions match testedAgainst
        run: node -e "const v = require('@deepseek-ai/dsh-tools/package.json').version; console.log('dsh-tools = ' + v); if (!/^0\.1\.5-rc/.test(v)) { console.error('dsh-tools 应在 0.1.5-rc 线，实际 ' + v); process.exit(1) }"
      - name: Make plugin resolvable as its package name
        run: node --input-type=module -e "import { copyFileSync, mkdirSync } from 'node:fs'; const out='node_modules/dsh-jev-prune'; mkdirSync(out,{recursive:true}); for (const f of ['index.js','jev.js','state.js','prune.js','receipt.js','package.json','cordis.patch.yml']) copyFileSync(f, out+'/'+f)"
      - name: Pure-function checks
        run: node check.js
      - name: Smoke test (fake ctx, real apply)
        run: node smoke_apply.mjs

  # 原生 V8 覆盖率：复用现有断言，不引入额外测试框架。阈值低于当前基线
  # （lines 95.88 / branches 82.84 / functions 94.69），既能阻止明显倒退，也给
  # Node 22/24 的插桩差异留出余量。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Make plugin resolvable as its package name
        run: node --input-type=module -e "import { copyFileSync, mkdirSync } from 'node:fs'; const out='node_modules/dsh-jev-prune'; mkdirSync(out,{recursive:true}); for (const f of ['index.js','jev.js','state.js','prune.js','receipt.js','package.json','cordis.patch.yml']) copyFileSync(f, out+'/'+f)"
      - name: Core-module coverage gate
        run: npm run coverage

  # 集成：装完整 DSH 依赖树。issue #20：此前该作业跑的两个脚本都不 import 任何 DSH 包，
  # "在真实宿主依赖环境下验证"名不副实——现在至少真实加载一次插件模块与 dsh-llm，
  # 并对随包发布的工具脚本做语法检查。
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin deps + locked DSH host tree
        run: |
          npm ci --no-audit --no-fund
          # ⚠️ 宿主树来自**提交进仓库的锁定 fixture**（ci/dsh-host/package-lock.json，
          # 585 包全锁 0.1.5-rc.2），用 npm ci 安装——不做任何 semver range 解析。
          # 2026-09-22 两次实测：上游把 next 升到 0.1.5-rc.3 时只发了一部分子包
          # （dsh-client-ui-sidebar-documentpreview@rc.3 缺失），而 dsh@rc.2 的 69 个
          # 依赖全部声明为 `^0.1.5-rc.2`——semver 规则下该 range 匹配到同元组更大的
          # rc.3，于是连钉死装 rc.2 都会在解析时漂进 rc.3 并 ETARGET（第一次用 @next、
          # 第二次钉 rc.2 都炸在同一处）。浮动标签不行、钉单包也不行，唯一稳的是
          # lockfile 冻结整棵树。升级宿主 = 在能装通新版本的机器上重新生成 fixture。
          cd ci/dsh-host && npm ci --no-audit --no-fund
      - name: Make plugin resolvable as its package name
        run: |
          mkdir -p ci/dsh-host/node_modules/dsh-jev-prune
          cp index.js jev.js state.js prune.js receipt.js package.json cordis.patch.yml ci/dsh-host/node_modules/dsh-jev-prune/
      - name: Syntax-check shipped tools
        run: |
          node --check check.js
          node --check smoke_apply.mjs
          node --check inspect_session.mjs
          node --check verify_real_shapes.mjs
          node --check wire_profile.mjs
      - name: Real-host smoke (dynamic imports & version probe)
        working-directory: ci/dsh-host
        run: |
          node --input-type=module -e "
            const m = await import('@deepseek-ai/dsh-llm');
            if (typeof m.freezeMessage !== 'function') { console.error('freezeMessage 不可用'); process.exit(1); }
            console.log('freezeMessage ok');
          "
          node --input-type=module -e "
            const m = await import('dsh-jev-prune');
            if (m?.name !== 'jev-prune') { console.error('插件模块加载异常'); process.exit(1); }
            console.log('plugin module loads against real DSH tree');
          "
      - name: Assert host fixture matches testedAgainst
        working-directory: ci/dsh-host
        run: |
          node -e "const v = require('@deepseek-ai/dsh/package.json').version; if (v !== '0.1.5-rc.2') { console.error('宿主树应为 0.1.5-rc.2，实际 ' + v); process.exit(1) }"
          echo "host = @deepseek-ai/dsh@$(node -p "require('@deepseek-ai/dsh/package.json').version")"
      # ⚠️ 命名更正（review 复查）：这一步跑在**仓库根**，因此 Node 从根目录向上解析模块——
      # 拿到的是根 `node_modules`（根 devDependencies 钉了 dsh-llm/dsh-tools/schemastery
      # @0.1.5-rc.2 及其传递依赖，约 18 个包），**不是** ci/dsh-host 那棵 585 包的 fixture 树。
      # 所以它证明的是"在真实 dsh-llm 下跑通"，不等于"在完整宿主树下跑通"——原步骤名
      # （Checks against real DSH tree）会让人以为后者。真正用到 fixture 的是上面两条
      # 带 `working-directory: ci/dsh-host` 的步骤（模块可加载 + 宿主版本号断言）。
      # 完整宿主包（@deepseek-ai/dsh 及其内置 compaction 束）只在跑 A/B 对照时才需要，
      # 届时由 harness 从 fixture 树里解析。
      - name: Repeat checks against the root dependency tree (real dsh-llm, not the host fixture)
        run: |
          node check.js
          node smoke_apply.mjs
